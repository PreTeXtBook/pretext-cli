# ********************************
# |docname| - Project configuration
# ********************************
#
# uv
# ==
# See https://docs.astral.sh/uv/concepts/projects/dependencies/ for how uv/PEP 621
# dependency specifiers work.
#
# Project metadata
# ----------------
[project]
name = "pretext"
version = "2.49.2"
description = "A package to author, build, and deploy PreTeXt projects."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Oscar Levin", email = "oscar.levin@unco.edu" },
    { name = "Steven Clontz", email = "steven.clontz@gmail.com" },
]
requires-python = ">=3.10,<4.0"

# Dependencies
# ------------
dependencies = [
    "lxml>=6,<7",
    "requests>=2,<3",
    "GitPython>=3,<4",
    "click>=8,<9",
    "pdfCropMargins>=1.0.9,<1.1",
    "PyPDF2>=2.5,<2.6",
    "pymupdf>=1.24,<2",
    "click-log>=0.4,<0.5",
    "ghp-import>=2,<3",
    "single-version>=1,<2",
    "playwright>=1,<2",
    "pydantic-xml==2.14.3",
    "qrcode>=7,<8",
    "psutil>=7,<8",
    "plastex>=3,<4",
    "jinja2>=3,<4",
    "coloraide>=4,<5",
    "citeproc-py>=0,<1",
]

[project.urls]
Homepage = "https://pretextbook.org"
Repository = "https://github.com/PreTeXtBook/pretext-cli"

[project.scripts]
pretext = "pretext.cli:main"

[project.optional-dependencies]
homepage = ["pelican[markdown]>=4.10,<5"]
prefigure = ["prefig[text]>=0.7.2,<0.8"]
all = ["pelican[markdown]>=4.10,<5", "prefig[text]>=0.7.2,<0.8"]

# Development dependencies
# ------------------------
[dependency-groups]
dev = [
    "black>=24.10,<27.0",
    "codechat-server>=0,<1",
    "flake8>=6,<7",
    "lxml-stubs>=0,<1",
    "mypy>=1,<2",
    # mypy --install-types shells out to `python -m pip`; uv-managed venvs
    # don't include pip by default, so it needs to be present explicitly.
    "pip",
    "pytest>=7,<10",
    "pytest-console-scripts>=1,<2",
    "pytest-cov>=4,<5",
    "pytest-mock>=3,<4",
    # Needed by coverage, so it can read its configuration from this file. See the [Coverage docs](https://coverage.readthedocs.io/en/7.2.7/config.html).
    "toml>=0,<1",
    # Misc
    "errorhandler>=2.0.1,<3",
    "pep8-naming>=0.14.1,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# pretext/core/*.py and pretext/resources/*.zip are generated by
# scripts/fetch_core.py and are gitignored, so they must be force-included
# here or they won't make it into the sdist/wheel.
artifacts = [
    "pretext/core/*.py",
    "pretext/resources/*.zip",
    "pretext/resources/*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["pretext"]

[tool.pytest.ini_options]
script_launch_mode = "subprocess"


# mypy configuration
# ==================
# To run, execute ``mypy`` from the directory containing this file.
#
# This section `must <https://mypy.readthedocs.io/en/stable/config_file.html#config-file-format>`_ be present.
[tool.mypy]
# See `files <https://mypy.readthedocs.io/en/stable/config_file.html#confval-files>`_.
files = "pretext,tests"
exclude = ["^pretext/core/.*\\.py$",]
check_untyped_defs = true
disallow_untyped_defs = true

# Ignores for libraries with no type hints
# ----------------------------------------
[[tool.mypy.overrides]]
module = [
    "click_log",
    "single_version",
    "ghp_import",
    # We're installing ``lxml-stubs``, but it doesn't have stubs for this yet.
    "lxml.ElementInclude",
    "pytest",
    "pytest_console_scripts",
    "plasTeX.TeX",
    "plasTeX.Renderers.PageTemplate",
]
ignore_missing_imports = true

# Tell mypy to skip imports of the core. Per [SO](https://stackoverflow.com/a/70367929/16038919),
# the `exclude` above will be overridden when code mypy scans includes the core.
# The setting below prevents this.
[[tool.mypy.overrides]]
module = ["pretext.core"]
follow_imports = "skip"


# Coverage configuration
# ======================
[tool.coverage.run]
# Select code to be covered -- everything in the `pretext` subdirectory.
source = ["pretext"]
# This doesn't work. It works if the path is absolute, but I can't find any relative path that does work.
#omit = [ "pretext/core/pretext.py" ]

[tool.coverage.report]
# This is a simple workaround for the `omit` setting above: don't report coverage for the PreTeXt core.
omit = ["pretext/core/pretext.py"]

[tool.coverage.html]
# For better organization, place generated reports under the tests.
directory = "tests/htmlcov"
